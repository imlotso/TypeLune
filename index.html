<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d6d9df" />
    <meta name="description" content="在轻松的云朵小屋里，练习中文与英文打字。" />
    <link rel="icon" type="image/jpeg" href="/src/assets/typelune-wordmark.jpg" />
    <script>
      try {
        const savedTheme = localStorage.getItem('cloudtyping.theme.v1');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <style>
      body{margin:0;background:#cfd2d8;color:#1d1d1f;font-family:'Nunito','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
      [data-theme='dark'] body{background:#141416;color:#f5f5f7}
      #root>header{min-height:76px;padding:0 3.5%;display:flex;align-items:center;background:#d6d9df;border-bottom:1px solid rgba(0,0,0,.09);font-size:14px}
      #root>header a{color:inherit;text-decoration:none;margin:0 6px}
      #root>main{width:min(900px,calc(100% - 32px));margin:28px auto;padding:24px 28px;border-radius:19px;background:rgba(234,237,241,.94);border:1px solid rgba(0,0,0,.09)}
      #root>main h1{margin:0 0 8px;font-size:20px}
      #root>main p{margin:0 0 12px;color:#454952;line-height:1.6}
      [data-theme='dark'] #root>header{background:#1c1c1e;border-bottom-color:rgba(255,255,255,.08)}
      [data-theme='dark'] #root>main{background:rgba(28,28,30,.95);border-color:rgba(255,255,255,.1)}
      [data-theme='dark'] #root>main p{color:#98989d}
    </style>
    <title>TypeLune · 中英文打字测试</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
